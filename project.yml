# XcodeGen spec: `make project` generates Vigilia.xcodeproj (not committed).
# CI archives it with automatic signing (see .github/workflows/build.yml);
# build.sh is still the way to build locally without an Xcode project.
#
# Identifiers: APP_BUNDLE_ID is the app's bundle ID. It is fixed: do not change
# it or override it (CI and build.sh use the same value). Every extension uses
# $(APP_BUNDLE_ID).<suffix>,
# e.g. for a widget target:
#     PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
name: Vigilia
options:
  # iOS 26 or later uses AlarmKit; iOS 18 to 25 falls back to local notifications
  # (src/App/AlarmBackend.swift). It still needs the iOS 26 SDK (Xcode 26).
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    APP_BUNDLE_ID: com.leonardoramirezr.leoneraalarm
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Shown at the end of the settings. CI passes the real name (build-<N>-<commit> or 0.x.0).
    VIGILIA_BUILD_NAME: local
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Vigilia:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: src
      - path: Resources/Assets.xcassets
      # Sounds (CAF) and Sounds.json from scripts/prepare_resources.sh, copied to the bundle root.
      - path: build/resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Vigilia
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Vigilia.entitlements
        # AlarmKit doesn't exist before iOS 26: weak, so the app still launches on iOS 18.
        OTHER_LDFLAGS: "$(inherited) -weak_framework AlarmKit"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only (set on the target: XcodeGen's iOS preset would make it "1,2").
        TARGETED_DEVICE_FAMILY: "1"
